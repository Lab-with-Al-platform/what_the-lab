user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 응답 머리말에 nginx 버전을 보여 주지 않아요.
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # origin.conf 의 map 은 CloudFront 비밀 헤더 값(64자)을 열쇠로 써요.
    # 기본 칸 크기(64)로는 64자 열쇠가 들어가지 않아 nginx 가 시작하지 못해요. → 128
    map_hash_bucket_size 128;

    # 파일 업로드 용량 제한 (포트폴리오 PDF 고려 25MB)
    client_max_body_size 25M;

    # gzip 압축 설정
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    # 실제 사용자 IP 복원: CloudFront는 X-Forwarded-For 맨 끝에 사용자 IP를 붙여요.
    # 보안 그룹이 CloudFront만 들여보내고, 비밀 헤더가 없으면 403이라 연결한 쪽을 믿어요.
    # real_ip_recursive off → 맨 끝 값(CloudFront가 붙인 값)만 써요. 사용자가 앞에 끼워 넣은 값은 무시돼요.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # 요청 제한 (IP 하나 기준). 넘치면 429.
    # auth: 디스코드 로그인·콜백, 인증번호 발송 → 1분에 10번
    # api : 나머지 API → 1초에 20번 (화면 하나가 API를 여러 개 동시에 불러요)
    limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:5m rate=20r/s;
    limit_req_status 429;

    # server 블록은 templates/origin.conf.template 에 있어요.
    # nginx 이미지가 시작할 때 ${ORIGIN_DOMAIN} 같은 값을 채워 conf.d/origin.conf 로 만들어요.
    # (이미지 기본 conf.d/default.conf 는 읽지 않도록 이 파일만 불러와요.)
    include /etc/nginx/conf.d/origin.conf;
}
