# WHAT THE LAB (LabBridge) — 프로덕션 검증용 Docker Compose
# EC2 t4g.micro(1GiB) 한 대 + 스왑 1GB 기준 (docs/aws-deployment/02 2-1절)
# 운영 DB는 RDS, 화면은 S3+CloudFront라서 여기에는 서버 컨테이너 3개만 있어요: nginx·backend·discord-bot
#
# 비밀값은 이 파일에 쓰지 않아요 (저장소가 공개라서). 값이 빠지면 `${이름:?안내}` 때문에 실행이 멈춰요.
# 실행(EC2): docker compose -f docker-compose.prod.yml -f docker-compose.awslogs.yml --env-file .env.production up -d
#   - docker-compose.awslogs.yml: 로그를 CloudWatch Logs로 보내는 설정 (EC2에서만 덧붙여요)
#   - 로컬 리허설은 awslogs 파일 없이 실행해요 (AWS 권한이 없어 로그 전송이 실패해요)
# 필요한 값 목록: infra/env.production.example

# backend 와 discord-bot 이 함께 쓰는 환경변수 (같은 이미지·같은 app/config.py 를 읽어요)
# backend/app 이 읽는 값은 모두 여기 있어야 해요. 빠지면 backend/tests/test_prod_compose.py 가 실패해요.
x-app-environment: &app-environment
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 필요}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL 필요 (로그인 후 돌아갈 화면 주소)}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS 필요}
  # 관리자 쓰기 요청·게시판 글쓰기를 허용할 화면 주소. 비우면 CORS_ORIGINS 와 같아요 (코드 기본값은 localhost)
  INSIGHT_ALLOWED_ORIGINS: ${INSIGHT_ALLOWED_ORIGINS:-${CORS_ORIGINS}}
  COMMUNITY_ALLOWED_ORIGINS: ${COMMUNITY_ALLOWED_ORIGINS:-${CORS_ORIGINS}}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID 필요}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET 필요}
  DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:?DISCORD_REDIRECT_URI 필요}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
  DISCORD_COLLAB_CATEGORY_ID: ${DISCORD_COLLAB_CATEGORY_ID:-}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요 (32자 이상 무작위)}
  # 운영 화면 관리자 (디스코드 사용자 ID, 쉼표로 구분). 만드는 법: infra/admins/README.md
  OPERATIONS_ADMIN_DISCORD_IDS: ${OPERATIONS_ADMIN_DISCORD_IDS:-}
  INSIGHT_ADMIN_DISCORD_IDS: ${INSIGHT_ADMIN_DISCORD_IDS:-}
  # 인사이트·방문 통계는 MVP+ 라서 기본으로 꺼 둬요
  INSIGHTS_ENABLED: ${INSIGHTS_ENABLED:-false}
  INSIGHT_VIEWS_ENABLED: ${INSIGHT_VIEWS_ENABLED:-false}
  ANALYTICS_COLLECTION_ENABLED: ${ANALYTICS_COLLECTION_ENABLED:-false}
  # 구글 로그인(이메일 받기)·캘린더. 키 파일은 아래 google 폴더에 두고 경로를 적어요. 비우면 구글 기능을 건너뛰어요
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
  # 업로드 파일은 볼륨(backend_uploads)이 연결된 곳에 저장해요.
  # 코드 기본값은 컨테이너에서 /backend/uploads 가 되어 권한 오류가 나요 (2026-11-18 확인)
  UPLOAD_DIR: /app/uploads

services:
  # 1. FastAPI Web API 서버 (단일 Uvicorn Worker)
  backend:
    # EC2는 빌드하지 않고 ECR 이미지를 받아요. 로컬에서는 build 결과에 이 이름이 붙어요.
    image: ${BACKEND_IMAGE:-labbridge-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labbridge-prod-backend
    restart: unless-stopped
    environment: *app-environment
    volumes:
      - backend_uploads:/app/uploads
      # 구글 서비스 계정 키 (있을 때만). GOOGLE_SERVICE_ACCOUNT_FILE=/run/secrets/google/<파일 이름>
      - ${GOOGLE_KEY_DIR:-./secrets/google}:/run/secrets/google:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M  # micro 한도 (유휴 실측 약 105MiB)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - labbridge_internal

  # 2. Discord Gateway 봇 (상시 웹소켓 리스너)
  discord-bot:
    image: ${BACKEND_IMAGE:-labbridge-backend:local}  # backend와 같은 이미지
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labbridge-prod-discord-bot
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    command: ["python", "-m", "app.discord_gateway"]
    volumes:
      # 구글 서비스 계정 키 (있을 때만). GOOGLE_SERVICE_ACCOUNT_FILE=/run/secrets/google/<파일 이름>
      - ${GOOGLE_KEY_DIR:-./secrets/google}:/run/secrets/google:ro
    # backend 이미지의 HEALTHCHECK(8000번 API 확인)를 물려받지 않게 꺼요. 봇은 웹 서버가 없어서 항상 unhealthy가 돼요.
    healthcheck:
      disable: true
    environment: *app-environment
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M  # micro 한도 (유휴 실측 약 80MiB)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - labbridge_internal

  # 3. Nginx (API 전용 진입점, CloudFront → EC2)
  nginx:
    image: nginx:alpine
    container_name: labbridge-prod-nginx
    restart: unless-stopped
    # 보안 그룹이 CloudFront만 443으로 들여보내요. 80번은 열지 않아요. (B4)
    ports:
      - "443:443"
    environment:
      ORIGIN_DOMAIN: ${ORIGIN_DOMAIN:?ORIGIN_DOMAIN 필요 (예 origin.labbridge.kr)}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:?ORIGIN_VERIFY_SECRET 필요 (CloudFront 비밀 헤더 값)}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      # certbot(DNS-01)이 EC2에 받아 둔 오리진 인증서
      - ${ORIGIN_CERT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 48M  # micro 한도 (유휴 실측 약 15MiB)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - labbridge_internal

networks:
  labbridge_internal:
    driver: bridge

volumes:
  backend_uploads:

