name: FAQ actual-UI screenshots (isolated demo)

on:
  push:
    branches:
      - feature/faq-integrated-help-20261103
    paths:
      - frontend/scripts/capture-faq-real-ui.mjs
      - .github/workflows/faq-real-ui-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/faq-integrated-help-20261103

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and browser automation
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start isolated Next.js application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3000/api/v1
        run: |
          nohup npm run dev > /tmp/faq-next.log 2>&1 &
          for i in $(seq 1 100); do
            curl -fsS http://127.0.0.1:3000/faq > /dev/null && exit 0
            sleep 2
          done
          tail -200 /tmp/faq-next.log
          exit 1

      - name: Capture browser-rendered product screens with isolated API fixtures
        working-directory: frontend
        run: node scripts/capture-faq-real-ui.mjs

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faq-real-frontend-screenshots
          if-no-files-found: warn
          path: frontend/public/faq/screenshots/
          retention-days: 14

      - name: Commit screenshot assets to FAQ branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/faq/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "assets(faq): screenshots from actual Next.js UI with isolated demo records"
            git fetch origin feature/faq-integrated-help-20261103
            git rebase origin/feature/faq-integrated-help-20261103
            git push origin HEAD:feature/faq-integrated-help-20261103
          fi
