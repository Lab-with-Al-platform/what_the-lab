        return `&lt;h2&gt;함께 일하기 좋은 조건&lt;/h2&gt;&lt;p class=&quot;lb-panel-caption&quot;&gt;전문가가 직접 작성한 조건입니다. 협업 요청 전에 확인해 주세요.&lt;/p&gt;&lt;div class=&quot;lb-condition-list&quot;&gt;${conditions.map(c=&gt;`&lt;div class=&quot;lb-condition&quot;&gt;&lt;strong&gt;${c[0]}&lt;/strong&gt;&lt;span&gt;${c[1]}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;lb-guidance&quot;&gt;&lt;h3&gt;협업 요청에 이런 내용을 담아주세요&lt;/h3&gt;&lt;p&gt;연구 목표와 풀고 싶은 질문&lt;br&gt;보유 데이터의 종류·규모·라벨 여부&lt;br&gt;기대하는 전문가 역할과 예상 일정&lt;br&gt;성과 활용 계획과 연구팀의 협의 조건&lt;/p&gt;&lt;/div&gt;`;
      }
      function renderReviews() {
        return `&lt;h2&gt;함께한 연구팀의 평가&lt;/h2&gt;&lt;p class=&quot;lb-panel-caption&quot;&gt;완료된 연구에 참여한 연구팀이 남긴 평가입니다.&lt;/p&gt;&lt;div class=&quot;lb-rating-summary&quot;&gt;&lt;div&gt;&lt;div class=&quot;lb-score&quot;&gt;4.8 &lt;small&gt;/ 5&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;lb-stars&quot; aria-label=&quot;5점 만점 중 4.8점&quot;&gt;★★★★★&lt;/div&gt;&lt;p&gt;연구 5건 · 평가 12개&lt;/p&gt;&lt;/div&gt;&lt;div&gt;${[[&#x27;전문성&#x27;,4.9],[&#x27;소통&#x27;,4.7],[&#x27;일정 준수&#x27;,4.8],[&#x27;결과물 품질&#x27;,4.8]].map(([name,score])=&gt;`&lt;div class=&quot;lb-rating-row&quot;&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;div class=&quot;lb-rating-track&quot;&gt;&lt;div class=&quot;lb-rating-fill&quot; style=&quot;width:${score*20}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;b&gt;${score}&lt;/b&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;article class=&quot;lb-review&quot;&gt;&lt;h3&gt;흉부 X-ray 이상 소견 탐지 공동 연구 &amp;nbsp; &lt;span class=&quot;lb-badge&quot;&gt;4.9&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;“라벨 품질 문제를 먼저 짚어줘서 연구 방향을 빠르게 잡았어요. 모델 결과를 연구팀이 해석할 수 있도록 함께 정리해 주었습니다.”&lt;/p&gt;&lt;small&gt;OO대학교병원 영상의학과 · 2026.06&lt;/small&gt;&lt;/article&gt;&lt;article class=&quot;lb-review&quot;&gt;&lt;h3&gt;병리 슬라이드 암 조직 분류 &amp;nbsp; &lt;span class=&quot;lb-badge&quot;&gt;4.8&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;“틀린 사례를 정리해 줘서 논문 작성에 도움이 됐어요. 실험과 모델 분석 사이에서 논의할 기준을 만들 수 있었습니다.”&lt;/p&gt;&lt;small&gt;△△대학교 병리학교실 · 2025.05&lt;/small&gt;&lt;/article&gt;`;
      }
      function updateDetailPanel() {
        const expert=experts.find(e=&gt;e.id===state.selectedExpert)||experts[0];
        root.querySelector(&#x27;#lb-v3-profile-panel&#x27;).innerHTML=state.detailTab===&#x27;research&#x27;?renderHistory(expert):state.detailTab===&#x27;conditions&#x27;?renderConditions():renderReviews();
        root.querySelectorAll(&#x27;[data-detail-tab]&#x27;).forEach(b=&gt;{b.setAttribute(&#x27;aria-selected&#x27;,String(b.dataset.detailTab===state.detailTab));});
        const active=root.querySelector(`[data-detail-tab=&quot;${state.detailTab}&quot;]`);
        root.querySelector(&#x27;#lb-v3-profile-panel&#x27;).setAttribute(&#x27;aria-labelledby&#x27;,active.id);
        icons();
      }
      function renderDetail() {
        const e=experts.find(item=&gt;item.id===state.selectedExpert)||experts[0];
        content.innerHTML=`&lt;div class=&quot;lb-profile-grid&quot;&gt;&lt;section class=&quot;lb-profile-hero&quot;&gt;&lt;div class=&quot;lb-profile-person&quot;&gt;&lt;div class=&quot;lb-avatar ${e.color}&quot;&gt;${e.initial}&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;lb-profile-name&quot;&gt;&lt;h1&gt;${e.name}&lt;/h1&gt;&lt;span class=&quot;lb-verified&quot;&gt;${icon(&#x27;badge-check&#x27;)}전문가 인증&lt;/span&gt;&lt;/div&gt;&lt;p&gt;${e.title}&lt;br&gt;${e.affiliation}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lb-tag-list&quot;&gt;${e.tasks.map(t=&gt;`&lt;span class=&quot;lb-tag&quot;&gt;${t}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;span class=&quot;lb-tag&quot;&gt;${e.tech.split(&#x27; · &#x27;)[0]}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;lb-role-intro&quot;&gt;&lt;h2&gt;이런 역할을 맡을 수 있어요&lt;/h2&gt;&lt;p&gt;${e.id===&#x27;kim&#x27;?&#x27;의료영상 분류·분할 연구를 진행했습니다. 임상 데이터의 품질 검증부터 모델 평가까지 연구팀과 함께 설계할 수 있습니다.&#x27;:e.role}&lt;/p&gt;&lt;div class=&quot;lb-check-list&quot;&gt;&lt;span&gt;${icon(&#x27;check&#x27;)}데이터 품질 검토와 분석 기준 정리&lt;/span&gt;&lt;span&gt;${icon(&#x27;check&#x27;)}모델 설계, 학습, 성능 평가&lt;/span&gt;&lt;span&gt;${icon(&#x27;check&#x27;)}실패 사례 분석과 연구 결과 정리&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lb-profile-numbers&quot;&gt;&lt;div&gt;&lt;small&gt;완료한 연구&lt;/small&gt;&lt;strong&gt;${e.research}건&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;학술 논문&lt;/small&gt;&lt;strong&gt;${e.papers}편&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;참여한 연구 분야&lt;/small&gt;&lt;strong&gt;${e.domains.join(&#x27; · &#x27;)}&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;lb-mobile-inquiry&quot;&gt;&lt;span class=&quot;lb-status-pill&quot;&gt;${e.status}&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;lb-primary cursor-interaction&quot; data-inquiry=&quot;${e.id}&quot;&gt;${icon(&#x27;mail&#x27;)}협업 요청하기&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;aside class=&quot;lb-profile-side&quot;&gt;&lt;div class=&quot;lb-side-card&quot;&gt;&lt;h2&gt;이 전문가와 함께하기&lt;/h2&gt;&lt;span class=&quot;lb-status-pill&quot;&gt;${e.status}&lt;/span&gt;&lt;dl class=&quot;lb-side-facts&quot;&gt;&lt;div class=&quot;lb-side-fact&quot;&gt;&lt;dt&gt;참여 가능 시점&lt;/dt&gt;&lt;dd&gt;${e.available?&#x27;즉시 · 일정 협의&#x27;:&#x27;참여 중인 연구 종료 후 협의&#x27;}&lt;/dd&gt;&lt;/div&gt;&lt;div class=&quot;lb-side-fact&quot;&gt;&lt;dt&gt;선호 방식&lt;/dt&gt;&lt;dd&gt;온라인 · 주 1회 회의&lt;/dd&gt;&lt;/div&gt;&lt;div class=&quot;lb-side-fact&quot;&gt;&lt;dt&gt;가능 시간&lt;/dt&gt;&lt;dd&gt;주 4~6시간&lt;/dd&gt;&lt;/div&gt;&lt;div class=&quot;lb-side-fact&quot;&gt;&lt;dt&gt;데이터 조건&lt;/dt&gt;&lt;dd&gt;비식별화 데이터&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;button type=&quot;button&quot; class=&quot;lb-primary cursor-interaction&quot; data-inquiry=&quot;${e.id}&quot;&gt;${icon(&#x27;mail&#x27;)}협업 요청하기&lt;/button&gt;&lt;div class=&quot;lb-process&quot;&gt;&lt;span&gt;요청 전달&lt;/span&gt;${icon(&#x27;chevron-right&#x27;)}&lt;span&gt;의사 확인&lt;/span&gt;${icon(&#x27;chevron-right&#x27;)}&lt;span&gt;협업 확정&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;lb-privacy&quot;&gt;${icon(&#x27;lock-keyhole&#x27;)}연락처는 서로 협업 의사를 확인한 뒤 공개됩니다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;lb-side-card&quot;&gt;&lt;h2&gt;함께 살펴볼 전문가&lt;/h2&gt;${experts.filter(x=&gt;x.id!==e.id).slice(0,2).map(x=&gt;`&lt;div class=&quot;lb-related-expert&quot;&gt;&lt;div class=&quot;lb-avatar ${x.color}&quot;&gt;${x.initial}&lt;/div&gt;&lt;div&gt;&lt;strong&gt;${x.name}&lt;/strong&gt;&lt;small&gt;${x.title}&lt;/small&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;lb-icon-button cursor-interaction&quot; data-profile=&quot;${x.id}&quot; aria-label=&quot;${x.name} 프로필 보기&quot;&gt;${icon(&#x27;chevron-right&#x27;)}&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/aside&gt;&lt;section class=&quot;lb-profile-body&quot;&gt;&lt;div class=&quot;lb-profile-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;전문가 상세 정보&quot;&gt;${[[&#x27;research&#x27;,&#x27;연구 경험&#x27;],[&#x27;conditions&#x27;,&#x27;협업 조건&#x27;],[&#x27;reviews&#x27;,&#x27;협업 평가 12&#x27;]].map(([key,title])=&gt;`&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; id=&quot;lb-v3-tab-${key}&quot; role=&quot;tab&quot; aria-controls=&quot;lb-v3-profile-panel&quot; aria-selected=&quot;${state.detailTab===key}&quot; data-detail-tab=&quot;${key}&quot;&gt;${title}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;lb-profile-panel&quot; role=&quot;tabpanel&quot; id=&quot;lb-v3-profile-panel&quot; aria-labelledby=&quot;lb-v3-tab-${state.detailTab}&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`;
        updateDetailPanel();
      }
      // 각 문단은 같은 화면 구조를 사용하되, 사례와 트렌드의 읽는 흐름을 구분합니다.
      function readingSection(index, title, body) {
        return `&lt;section class=&quot;lb-reader-section&quot; id=&quot;lb-v3-section-${index}&quot;&gt;&lt;h2&gt;&lt;span&gt;${String(index).padStart(2,&#x27;0&#x27;)}.&lt;/span&gt;${title}&lt;/h2&gt;${body}&lt;/section&gt;`;
      }
      function readingSteps(items) {
        return `&lt;div class=&quot;lb-method-grid&quot;&gt;${items.map((item,index)=&gt;`&lt;div class=&quot;lb-method&quot;&gt;${icon(item[0])}&lt;small&gt;STEP ${String(index+1).padStart(2,&#x27;0&#x27;)}&lt;/small&gt;&lt;h3&gt;${item[1]}&lt;/h3&gt;&lt;p&gt;${item[2]}&lt;/p&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
      }
      function readingChecks(items) {
        return `&lt;ul class=&quot;lb-reading-checks&quot;&gt;${items.map(text=&gt;`&lt;li&gt;${icon(&#x27;check&#x27;)}&lt;span&gt;${text}&lt;/span&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;`;
      }
      function readingTable(headings, rows) {
        return `&lt;table class=&quot;lb-read-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;${headings.map(text=&gt;`&lt;th scope=&quot;col&quot;&gt;${text}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(row=&gt;`&lt;tr&gt;${row.map(text=&gt;`&lt;td&gt;${text}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;`;
      }
      function caseReading(article) {
        if(article.id!==&#x27;cells&#x27;) {
          return [
            [&#x27;연구 배경과 질문&#x27;,`&lt;p&gt;${escape(article.description)} 연구팀은 이 과정을 반복 가능한 분석으로 바꾸고자 했습니다.&lt;/p&gt;&lt;p&gt;AI 모델을 고르기 전에, 연구에서 확인하려는 질문과 결과를 판단할 기준부터 함께 정리합니다.&lt;/p&gt;`],
            [&#x27;기존 방식의 한계&#x27;,`&lt;p&gt;사람이 직접 처리하는 작업은 연구 규모가 커질수록 시간이 늘어나고, 분석 기준을 일정하게 유지하기 어렵습니다.&lt;/p&gt;&lt;div class=&quot;lb-reader-note&quot;&gt;&lt;strong&gt;먼저 확인할 것&lt;/strong&gt;어떤 작업을 자동화할지, 연구자가 최종 판단해야 하는 부분은 무엇인지 구분합니다.&lt;/div&gt;`],
            [&#x27;AI 활용 방법&#x27;,`&lt;p&gt;${escape(article.topic)} 기술을 활용해 데이터를 정리하고, 비교 가능한 기준으로 모델을 평가하는 과정을 설계합니다.&lt;/p&gt;${readingSteps([[&#x27;folder-open&#x27;,&#x27;데이터 확인&#x27;,&#x27;형식·품질·권한 점검&#x27;],[&#x27;sliders-horizontal&#x27;,&#x27;기준 정리&#x27;,&#x27;라벨과 평가 지표 합의&#x27;],[&#x27;brain-circuit&#x27;,&#x27;모델 적용&#x27;,&#x27;기준 모델과 결과 비교&#x27;],[&#x27;clipboard-check&#x27;,&#x27;결과 검토&#x27;,&#x27;실패 사례와 재현성 확인&#x27;]])}`],
            [&#x27;결과와 적용 가능성&#x27;,`&lt;p&gt;자동화가 가능한 구간과 사람의 검토가 필요한 구간을 분리하면, 반복 작업을 줄이면서 연구의 판단 기준을 유지할 수 있습니다.&lt;/p&gt;&lt;p&gt;${escape(article.takeaway)}&lt;/p&gt;`],
            [&#x27;고려할 점과 한계&#x27;,`&lt;p&gt;다른 데이터에 같은 모델을 적용하기 전에는 측정 환경, 데이터의 분포, 평가 기준이 달라졌는지 확인해야 합니다.&lt;/p&gt;${readingChecks([&#x27;모델 결과를 독립적인 검증 데이터로 확인하기&#x27;,&#x27;데이터 사용 권한과 공유 범위 확인하기&#x27;,&#x27;오류 사례와 적용하지 않을 조건 기록하기&#x27;])}`],
            [&#x27;관련 자료&#x27;,`&lt;p&gt;아래는 사례 등록 시 연결할 자료의 정보 구조 예시입니다. 실제 논문이나 연구 결과를 인용한 콘텐츠는 아닙니다.&lt;/p&gt;${sourceDetails(&#x27;연구 방법과 평가 기준&#x27;,&#x27;데이터 종류, 전처리, 비교 모델, 평가 지표와 재현 방법을 기록합니다.&#x27;)} ${sourceDetails(&#x27;원문 및 부록&#x27;,&#x27;실제 사례 게시 시 검증된 논문 링크, 데이터 문서와 부록을 연결합니다.&#x27;)}`]
          ];
        }
        return [
          [&#x27;어떤 연구 문제였을까?&#x27;,`&lt;p&gt;현미경으로 촬영한 세포 이미지는 세포의 형태와 변화를 관찰하는 중요한 자료입니다. 하지만 서로 붙어 있거나 모양이 다양한 세포의 경계를 사람이 하나씩 표시하려면 많은 시간과 집중력이 필요합니다.&lt;/p&gt;&lt;p&gt;이 사례에서는 세포의 경계를 자동으로 나누는 &lt;b&gt;이미지 분할&lt;/b&gt;을 활용해, 연구자가 반복 작업보다 관찰과 해석에 집중할 수 있는 분석 흐름을 살펴봅니다.&lt;/p&gt;&lt;figure class=&quot;lb-figure&quot;&gt;&lt;div class=&quot;lb-figure-grid&quot;&gt;${[[&#x27;cells&#x27;,&#x27;세포 이미지&#x27;],[&#x27;tissue&#x27;,&#x27;조직 이미지&#x27;],[&#x27;protein&#x27;,&#x27;분자 구조 이미지&#x27;]].map(([key,label])=&gt;`&lt;div class=&quot;lb-figure-tile&quot;&gt;&lt;img src=&quot;${assets[key]}&quot; alt=&quot;${label} 시각 예시&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;figcaption&gt;이미지 데이터의 다양한 형태 · 이해를 돕기 위한 시각 예시&lt;/figcaption&gt;&lt;/figure&gt;`],
          [&#x27;기존 방식에는 어떤 한계가 있었을까?&#x27;,`&lt;p&gt;직접 세포의 경계를 그리는 방식은 분석자가 바뀌면 표시 기준도 달라질 수 있습니다. 세포가 겹치거나 촬영 조건이 달라지면 동일한 기준을 적용하기도 어렵습니다.&lt;/p&gt;&lt;div class=&quot;lb-reader-note&quot;&gt;&lt;strong&gt;핵심은 ‘완전 자동화’보다 일관된 분석 기준&lt;/strong&gt;AI가 만든 경계를 연구자가 검토하고 수정할 수 있어야 합니다. 자동화할 작업과 사람이 판단할 작업을 먼저 나누는 것이 출발점입니다.&lt;/div&gt;`],
          [&#x27;AI를 어떻게 활용했을까?&#x27;,`&lt;p&gt;딥러닝 기반 분할 모델은 세포 이미지의 색과 형태, 주변의 패턴을 함께 학습합니다. 연구팀과 AI 전문가는 세포를 구분할 기준을 정하고, 학습용 이미지와 검증용 이미지를 분리해 모델의 결과를 확인합니다.&lt;/p&gt;${readingSteps([[&#x27;images&#x27;,&#x27;데이터 수집&#x27;,&#x27;촬영 조건과 사용 권한 확인&#x27;],[&#x27;sliders-horizontal&#x27;,&#x27;전처리·라벨링&#x27;,&#x27;세포 경계의 기준 통일&#x27;],[&#x27;brain-circuit&#x27;,&#x27;모델 학습&#x27;,&#x27;세포의 형태와 패턴 학습&#x27;],[&#x27;clipboard-check&#x27;,&#x27;결과 검증&#x27;,&#x27;겹친 세포·오류 사례 검토&#x27;]])}&lt;p style=&quot;margin-top:14px&quot;&gt;모델이 제안한 경계는 연구자가 수정하고 다시 학습에 반영할 수 있도록 구성합니다. 검증할 때는 이미지 한 장보다 세포 단위의 오류와 누락을 함께 살펴봅니다.&lt;/p&gt;`],
          [&#x27;주요 결과는 어떻게 확인할까?&#x27;,`&lt;p&gt;단순히 “정확도가 높다”는 숫자 하나로 판단하지 않습니다. 세포의 경계가 얼마나 잘 맞는지, 작은 세포를 놓치지 않는지, 검토하는 데 실제로 시간이 줄었는지를 함께 확인합니다.&lt;/p&gt;${readingTable([&#x27;확인 항목&#x27;,&#x27;평가 방법&#x27;,&#x27;연구자가 보는 것&#x27;],[[&#x27;경계 품질&#x27;,&#x27;수동 라벨과 예측 경계 비교&#x27;,&#x27;겹친 세포를 잘 나누는가&#x27;],[&#x27;누락·과분할&#x27;,&#x27;오류 사례 유형별 검토&#x27;,&#x27;작은 세포를 놓치지 않는가&#x27;],[&#x27;검토 부담&#x27;,&#x27;수정 시간과 작업 흐름 비교&#x27;,&#x27;수작업보다 효율적인가&#x27;]])}&lt;div class=&quot;lb-reader-note&quot;&gt;이 시안은 정보 구조와 디자인을 보여주기 위한 예시입니다. 검증되지 않은 성능 수치나 논문 성과는 표시하지 않았습니다.&lt;/div&gt;`],
          [&#x27;내 연구에도 적용할 수 있을까?&#x27;,`&lt;p&gt;비슷한 이미지가 반복해서 쌓이고, 사람이 표시하는 기준이 비교적 명확한 연구라면 적용 가능성을 검토할 수 있습니다. 세포 계수, 조직 영역 구분, 실험 전후의 형태 변화 관찰처럼 이미지의 경계가 중요한 작업이 출발점이 됩니다.&lt;/p&gt;${readingChecks([&#x27;분석할 이미지와 촬영 조건을 설명할 수 있다&#x27;,&#x27;연구자가 합의한 세포 경계의 기준이 있다&#x27;,&#x27;모델이 틀린 결과를 검토할 담당자가 있다&#x27;])}&lt;blockquote class=&quot;lb-reading-quote&quot;&gt;&lt;p&gt;AI가 나눠준 경계 위에서,&lt;br&gt;연구자는 더 중요한 질문을 이어갑니다.&lt;/p&gt;&lt;footer&gt;LabBridge · 연구 활용 관점&lt;/footer&gt;&lt;/blockquote&gt;`],
          [&#x27;고려할 점과 한계&#x27;,`&lt;p&gt;촬영 장비와 배율, 염색 방법이 달라지면 기존 모델의 결과도 달라질 수 있습니다. 새로운 실험에 적용하기 전에는 해당 환경의 이미지로 다시 검증해야 합니다.&lt;/p&gt;&lt;p&gt;특히 겹친 세포나 경계가 흐릿한 이미지에서는 오류를 구분해 기록해야 합니다. 자동 분석 결과는 연구자의 검토를 대신하는 확정 판단이 아닙니다.&lt;/p&gt;`],
          [&#x27;관련 연구 및 자료&#x27;,`&lt;p&gt;사례가 실제로 등록되면 원문, 데이터 설명과 재현 자료를 이 영역에 연결합니다. 아래는 디자인 확인을 위한 자료 항목 예시입니다.&lt;/p&gt;${sourceDetails(&#x27;연구 방법 노트 · 이미지 분할 평가&#x27;,&#x27;분할의 평가 기준, 검증 데이터 구성, 실패 사례와 연구자의 수정 과정을 함께 기록하는 문서 영역입니다.&#x27;)} ${sourceDetails(&#x27;데이터 설명 · 촬영 및 라벨 기준&#x27;,&#x27;촬영 장비, 이미지 크기, 염색 조건, 라벨 정의와 데이터 사용 범위를 확인하는 영역입니다.&#x27;)}`]
        ];
      }
      function sourceDetails(title, text) {
        return `&lt;details class=&quot;lb-source-item&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;${title}&lt;/summary&gt;&lt;p&gt;${text}&lt;/p&gt;&lt;/details&gt;`;
      }
      function trendReading(article) {
        if(article.id!==&#x27;agents&#x27;) {
          return [
            [&#x27;어떤 변화가 일어나고 있을까?&#x27;,`&lt;p&gt;${escape(article.description)}&lt;/p&gt;&lt;p&gt;새로운 기술의 이름보다, 연구 과정에서 어떤 작업을 바꿀 수 있는지 중심으로 살펴봅니다.&lt;/p&gt;`],
            [&#x27;연구자는 어떻게 활용할까?&#x27;,`&lt;p&gt;${escape(article.takeaway)}&lt;/p&gt;${readingSteps([[&#x27;search&#x27;,&#x27;질문 정리&#x27;,&#x27;연구 목표와 제약 확인&#x27;],[&#x27;folder-open&#x27;,&#x27;자료 준비&#x27;,&#x27;데이터 품질과 권한 점검&#x27;],[&#x27;flask-conical&#x27;,&#x27;작게 실험&#x27;,&#x27;기존 방법과 결과 비교&#x27;],[&#x27;clipboard-check&#x27;,&#x27;검토·기록&#x27;,&#x27;오류와 적용 범위 정리&#x27;]])}`],
            [&#x27;도입 전에 확인할 조건&#x27;,`&lt;p&gt;사용 가능한 데이터, 결과의 검증 방법, 연구팀이 운영할 수 있는 도구인지부터 확인합니다.&lt;/p&gt;${readingChecks([&#x27;비공개 데이터를 외부 도구에 입력해도 되는가&#x27;,&#x27;결과를 독립적으로 확인할 방법이 있는가&#x27;,&#x27;도구를 바꿔도 연구 기록을 재현할 수 있는가&#x27;])}`],
            [&#x27;활용 가능성과 한계&#x27;,`&lt;p&gt;반복되는 작업의 보조 수단으로 시작하되, 연구의 최종 판단과 결론은 연구팀이 책임지고 확인합니다.&lt;/p&gt;&lt;div class=&quot;lb-reader-note&quot;&gt;&lt;strong&gt;기술의 가능성과 검증된 결과를 구분하기&lt;/strong&gt;새로운 기능이 있다는 것과 내 연구에서 효과가 확인되었다는 것은 다른 이야기입니다.&lt;/div&gt;`],
            [&#x27;관련 자료&#x27;,`&lt;p&gt;아래는 실제 콘텐츠 발행 시 출처와 도구 문서를 연결할 영역입니다. 기술 동향과 예시는 시안 확인용입니다.&lt;/p&gt;${sourceDetails(&#x27;기술 개념과 도구 문서&#x27;,&#x27;실제 발행 시 공식 문서와 공개된 연구를 확인하고 연결합니다.&#x27;)}`]
          ];
        }
        return [
          [&#x27;연구 보조 에이전트, 무엇이 다를까?&#x27;,`&lt;p&gt;대화형 AI가 질문에 답하는 도구라면, 연구 보조 에이전트는 자료 검색과 정리 같은 여러 단계를 이어주는 도구로 생각할 수 있습니다. 예를 들어 연구 질문에 맞춰 문헌을 찾고, 비교 기준에 따라 내용을 정리하고, 다음에 확인할 항목을 제안합니다.&lt;/p&gt;&lt;p&gt;중요한 변화는 답변을 길게 만드는 것이 아니라 &lt;b&gt;연구의 반복 작업을 하나의 흐름으로 연결하는 것&lt;/b&gt;입니다. 그 흐름에는 연구자가 확인하고 승인하는 단계가 함께 들어가야 합니다.&lt;/p&gt;&lt;div class=&quot;lb-reader-note&quot;&gt;&lt;strong&gt;에이전트란?&lt;/strong&gt;목표에 따라 여러 작업을 순서대로 수행하도록 구성한 AI 도구입니다. 스스로 연구의 진위를 보장하는 도구라는 뜻은 아닙니다.&lt;/div&gt;`],
          [&#x27;어떤 연구 작업에 활용할 수 있을까?&#x27;,`&lt;p&gt;문헌 탐색부터 시작하면 연구팀이 결과를 비교하고 검토하기 쉽습니다. 논문을 대체해 읽게 하기보다, 읽어야 할 자료와 확인할 근거를 정리하는 용도로 접근합니다.&lt;/p&gt;${readingTable([&#x27;연구 작업&#x27;,&#x27;AI의 보조 역할&#x27;,&#x27;연구자의 확인&#x27;],[[&#x27;문헌 탐색&#x27;,&#x27;검색어 확장·후보 문헌 정리&#x27;,&#x27;원문 존재와 관련성&#x27;],[&#x27;자료 비교&#x27;,&#x27;방법·데이터·제약을 표로 정리&#x27;,&#x27;인용된 근거와 맥락&#x27;],[&#x27;실험 준비&#x27;,&#x27;절차·확인 항목 초안 작성&#x27;,&#x27;안전·윤리·실행 가능성&#x27;],[&#x27;연구 기록&#x27;,&#x27;회의 내용·후속 질문 정리&#x27;,&#x27;누락과 잘못된 해석&#x27;]])}`],
          [&#x27;작게 시작하는 네 단계&#x27;,`&lt;p&gt;연구 과정 전체를 맡기기보다, 결과를 확인할 수 있는 작은 작업부터 시작합니다. 검색 범위와 출력 형식을 정해두면 AI가 무엇을 했고 어디에서 틀렸는지 찾기 쉬워집니다.&lt;/p&gt;${readingSteps([[&#x27;target&#x27;,&#x27;질문 정의&#x27;,&#x27;범위·대상·제외 조건 명시&#x27;],[&#x27;book-open&#x27;,&#x27;자료 제한&#x27;,&#x27;확인 가능한 문헌만 사용&#x27;],[&#x27;list-checks&#x27;,&#x27;결과 검토&#x27;,&#x27;원문·인용·해석 대조&#x27;],[&#x27;notebook-pen&#x27;,&#x27;과정 기록&#x27;,&#x27;도구·입력·수정 내용 보관&#x27;]])}&lt;blockquote class=&quot;lb-reading-quote&quot;&gt;&lt;p&gt;연구 보조 AI의 가치는&lt;br&gt;답을 대신 정하는 데 있지 않습니다.&lt;/p&gt;&lt;footer&gt;근거를 찾고 검토하는 시간을 돕는 도구&lt;/footer&gt;&lt;/blockquote&gt;`],
          [&#x27;도입 전에 확인해야 할 것&#x27;,`&lt;p&gt;공개되지 않은 연구 자료와 민감한 데이터는 입력 전에 사용 조건부터 확인합니다. 외부 검색이나 파일 접근 권한을 부여하는 경우에는 작업 범위와 저장되는 기록도 점검해야 합니다.&lt;/p&gt;${readingChecks([&#x27;검색 결과의 링크와 원문을 직접 확인하기&#x27;,&#x27;출처가 없는 주장과 인용을 분리해서 표시하기&#x27;,&#x27;비공개 데이터의 입력·저장·공유 조건 확인하기&#x27;,&#x27;실험 관련 제안은 안전·윤리 기준에 따라 검토하기&#x27;])}`],
          [&#x27;가능성과 한계를 함께 보기&#x27;,`&lt;p&gt;도구가 연결되어 있다고 해서 결과의 신뢰성이 자동으로 높아지는 것은 아닙니다. 검색이 잘못되면 요약과 다음 단계도 함께 틀릴 수 있습니다. 각 단계의 근거를 남기고, 연구자가 중간에 멈추거나 수정할 수 있어야 합니다.&lt;/p&gt;&lt;div class=&quot;lb-reader-note&quot;&gt;&lt;strong&gt;연구팀에 남아야 할 판단&lt;/strong&gt;연구 질문의 타당성, 실험의 안전성과 윤리, 데이터 해석, 최종 결론은 자동 실행 단계와 분리해 검토합니다.&lt;/div&gt;`],
          [&#x27;관련 자료와 다음 읽을거리&#x27;,`&lt;p&gt;실제 발행 시 확인된 연구, 공식 도구 문서와 발행일을 함께 연결합니다. 이 페이지의 콘텐츠와 자료 항목은 화면 구성 확인을 위한 예시입니다.&lt;/p&gt;${sourceDetails(&#x27;기술 개념 · 검색 증강 생성과 도구 사용&#x27;,&#x27;검색 결과의 원문 확인, 도구 실행 범위와 사람의 검토 단계 등을 설명하는 자료 영역입니다.&#x27;)} ${sourceDetails(&#x27;연구 활용 · 검토 체크리스트&#x27;,&#x27;문헌 비교 기준, 근거 확인, 비공개 데이터 처리와 작업 기록을 살펴보는 문서 영역입니다.&#x27;)}`]
        ];
      }
      function tocLinks(sections) {
        const shortTitles={
          &#x27;어떤 연구 문제였을까?&#x27;:&#x27;연구 배경과 문제&#x27;,
          &#x27;기존 방식에는 어떤 한계가 있었을까?&#x27;:&#x27;기존 방식의 한계&#x27;,
          &#x27;AI를 어떻게 활용했을까?&#x27;:&#x27;AI 활용 방법&#x27;,
          &#x27;주요 결과는 어떻게 확인할까?&#x27;:&#x27;결과와 검증 기준&#x27;,
